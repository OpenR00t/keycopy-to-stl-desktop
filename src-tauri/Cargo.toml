[package]
name = "keycopy-to-stl"
version = "1.0.0"
description = "Turns Flipper Zero Key Copier files into printable STL keys"
edition = "2021"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[features]
# Embed the UI so a plain `cargo build --release` gives a standalone executable.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
