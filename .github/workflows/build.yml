name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: keycopy-to-stl.exe
          - os: macos-latest
            bin: keycopy-to-stl
          - os: ubuntu-22.04
            bin: keycopy-to-stl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Build
        working-directory: src-tauri
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: keycopy-to-stl-${{ runner.os }}
          path: src-tauri/target/release/${{ matrix.bin }}
